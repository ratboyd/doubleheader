name: Daily health checks

# Independent jobs, one workflow (so there's only ONE thing to re-enable if
# GitHub auto-disables scheduled workflows after 60 days without commits):
#   ping          — Supabase keep-alive (below)
#   league-health — big-4 league search + Netlify deploy status
#                   (.github/scripts/health_check.py)
#   traffic       — daily Cloudflare visitor totals -> traffic.csv on the
#                   `traffic-data` branch (.github/scripts/traffic_log.py)
# Any job failing -> GitHub emails the repo owner.
#
# --- ping ---

# Supabase free-tier projects auto-pause after ~7 days of inactivity, which would
# take down the entire doubleheader backend (auth, preferences, the seen_events
# dedup, and the daily alert email). This workflow makes one authenticated REST
# request per day, which executes a real query against Postgres and resets the
# inactivity timer. It does NOT depend on the Netlify alerts cron, so the project
# stays awake even if that scheduled function ever stops running.
#
# The key below is the PUBLISHABLE (anon) key — the same one already shipped to
# browsers in public/auth.js — so it is safe to commit and needs no GitHub secret.
#
# Bonus: if the project is ever paused/unreachable, the request is non-200, the
# job fails, and GitHub emails the repo owner — so this doubles as an uptime check.

on:
  schedule:
    - cron: "17 6 * * *"   # daily at 06:17 UTC (offset from :00 to dodge GH cron congestion)
  workflow_dispatch: {}      # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase REST API
        env:
          SUPABASE_URL: https://govcexcjxbkshsnsrnqf.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_jSFOAreU6W7uvlZlYW_HiA_nEpVLQVH
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/seen_events?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Supabase REST status: $code"
          if [ "$code" != "200" ]; then
            echo "::error::Supabase returned $code (expected 200) — project may be paused or unreachable"
            exit 1
          fi
          echo "Keep-alive ping succeeded."

  league-health:
    # Compares each league's broad search against the team search for a few
    # teams' home games, and checks Netlify's deploy badge. Catches: a league
    # silently returning zero (stale TM ids), games dropped by the non-game
    # filter (bare "v" titles), stadium tours leaking in, the TM API/key
    # failing, and deploys failing while old code keeps serving.
    # Off-season (no games on either path) is skipped, not failed.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Self-test the decision rule against past incidents
        run: python3 .github/scripts/health_check.py --selftest
      - name: Check live site
        run: python3 .github/scripts/health_check.py

  traffic:
    # Appends yesterday's Cloudflare Web Analytics totals (bots excluded) to
    # traffic.csv on the `traffic-data` branch, building a lifetime history the
    # free dashboard can't show (it only keeps 30 days visible). Separate branch
    # + "[skip netlify]" so these commits never trigger a site deploy.
    # Needs repo secret CF_API_TOKEN (Cloudflare token, "Account Analytics: Read");
    # until it's added the job skips with a warning instead of failing.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record traffic
        run: |
          if [ -z "$CF_API_TOKEN" ]; then
            echo "::warning::CF_API_TOKEN secret not set yet - skipping the traffic log."
            exit 0
          fi
          cp .github/scripts/traffic_log.py "$RUNNER_TEMP/traffic_log.py"
          if git ls-remote --exit-code --heads origin traffic-data >/dev/null 2>&1; then
            git fetch origin traffic-data
            git checkout -B traffic-data origin/traffic-data
          else
            git checkout --orphan traffic-data
            git rm -rf --quiet .
          fi
          python3 "$RUNNER_TEMP/traffic_log.py" traffic.csv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add traffic.csv
          if git diff --cached --quiet; then echo "No change to traffic.csv"; exit 0; fi
          git commit -m "Traffic log $(date -u +%F) [skip netlify]"
          git push origin traffic-data
